<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quadrilateral Distortion Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <section class="workspace">
      <header class="topbar">
        <div class="brand">
          <h1>Quadrilateral Distortion Lab</h1>
          <p>Train the eye on the ugliest legal version of each shape.</p>
        </div>
        <button class="icon-btn" id="resetBtn" title="Reset shape" aria-label="Reset">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-2.2-5.8" />
            <path d="M21 4v6h-6" />
          </svg>
        </button>
      </header>

      <div class="stage-wrap">
        <canvas id="stage"></canvas>
      </div>

      <div class="stats">
        <div class="stat"><span class="k">SHAPE</span><span class="v" id="statShape">Kite</span></div>
        <div class="stat"><span class="k">PERIMETER</span><span class="v" id="statPerimeter">0 px</span></div>
        <div class="stat"><span class="k">AREA</span><span class="v" id="statArea">0 px²</span></div>
        <div class="stat"><span class="k">DRAGGING</span><span class="v" id="statDrag">None</span></div>
      </div>

      <footer class="controls">
        <label class="control">
          Shape Type
          <select id="shapeSelect"></select>
        </label>
        <div class="mood-btns">
          <button type="button" id="neatBtn">Textbook</button>
          <button type="button" id="uglyBtn" class="active">Ugly</button>
        </div>
        <label class="control">
          Show Diagonals
          <span class="switch">
            <input type="checkbox" id="diagToggle" checked />
            <span class="slider"></span>
          </span>
        </label>
        <label class="control">
          Show Parallel Sides
          <span class="switch">
            <input type="checkbox" id="parallelToggle" />
            <span class="slider"></span>
          </span>
        </label>
        <label class="control">
          Show Symmetry
          <span class="switch">
            <input type="checkbox" id="symToggle" />
            <span class="slider"></span>
          </span>
        </label>
      </footer>
    </section>

    <aside class="side">
      <div class="card">
        <h2>FAMILY TREE</h2>
        <div class="tree" id="tree"></div>
      </div>

      <div class="card lesson">
        <h2>THE RULE</h2>
        <h3 id="lessonName">Kite</h3>
        <p id="lessonRule"></p>
        <h2>PROPERTIES</h2>
        <div class="props" id="propReadout"></div>
        <h2>THE UGLY VERSION</h2>
        <p id="lessonUgly"></p>
        <h2>WHAT IT PROVES</h2>
        <p id="lessonProves"></p>
      </div>

      <div class="card">
        <h2>VERTICES</h2>
        <div class="grid-2" id="vertexReadout"></div>
      </div>

      <div class="card">
        <h2>SIDES</h2>
        <div class="grid-2" id="sideReadout"></div>
      </div>

      <div class="card">
        <h2>ANGLES</h2>
        <div class="grid-2" id="angleReadout"></div>
      </div>

      <div class="card">
        <h2>DIAGONALS</h2>
        <div id="diagReadout"></div>
      </div>
    </aside>
  </div>

  <script src="js/math2d.js"></script>
  <script src="js/shapes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
